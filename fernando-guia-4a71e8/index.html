<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Guía mudada · Kallari</title>
<style>
  :root { --bg:#EDEAE0; --card:#FFFFFF; --ink:#211E19; --muted:#6E6858; --line:#DBD5C4; --accent:#2F6B52; --accent-ink:#FDFBF6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1A1613; --card:#221D18; --ink:#EEE7D9; --muted:#A89E8A; --line:#3C352A; --accent:#57A184; --accent-ink:#0D1512; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--bg); color:var(--ink); font:17px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width:460px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 20px; }
  .eyebrow { margin:0 0 6px; font:600 .72rem/1 ui-monospace, Consolas, monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  h1 { margin:0 0 12px; font-size:1.45rem; line-height:1.25; }
  p { margin:0 0 12px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Guía de ventas · Kallari</p>
  <h1>Fernando, tu guía se mudó</h1>
  <p>Desde el 30 de octubre tu guía está dentro de tu panel nuevo, al lado de tu lista: toca "abrir la guía".</p>
  <p><strong>Entra con el enlace y la clave que te pasa José.</strong></p>
</main>
</body>
</html>
