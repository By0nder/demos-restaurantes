<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Panel cerrado · Kallari</title>
<style>
  :root { --bg:#EDEAE0; --card:#FFFFFF; --ink:#211E19; --muted:#6E6858; --line:#DBD5C4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1A1613; --card:#221D18; --ink:#EEE7D9; --muted:#A89E8A; --line:#3C352A; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--bg); color:var(--ink); font:17px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width:460px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 20px; }
  .eyebrow { margin:0 0 6px; font:600 .72rem/1 ui-monospace, Consolas, monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  h1 { margin:0 0 12px; font-size:1.45rem; line-height:1.25; }
  p { margin:0 0 12px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Panel de envíos · Kallari</p>
  <h1>Este panel se cerró</h1>
  <p>El panel de envíos se cerró el 30 de octubre de 2026 y ya no tiene negocios por contactar.</p>
  <p>Si tienes una conversación pendiente con algún negocio, pásasela a José.</p>
</main>
</body>
</html>
