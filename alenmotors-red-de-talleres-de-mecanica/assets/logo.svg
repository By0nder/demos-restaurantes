<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 110" role="img" aria-label="ALENMOTORS">
  <!-- Logo de ALENMOTORS, reconstruido de su tarjeta: el arco dorado con forma de
       auto sobre el nombre. Sin la bajada "red de talleres" — no lo es.
       El texto va en `currentColor` a propósito: así sale negro sobre el fondo
       claro y blanco en modo oscuro, sin necesidad de dos archivos. -->
  <g fill="#d4a017">
    <!-- El arco: la silueta del techo y el capó que corona la marca. -->
    <path d="M22 74C34 40 74 16 132 12c62-4 122 14 160 44 8 6 15 10 24 12l14 3-2 12-18-4c-13-3-22-9-32-17C246 36 192 22 137 25 86 28 51 48 39 78z"/>
    <!-- Las dos ruedas insinuadas bajo el arco. -->
    <circle cx="96" cy="80" r="9"/>
    <circle cx="248" cy="80" r="9"/>
  </g>
  <text x="170" y="100" text-anchor="middle"
        font-family="Archivo, Arial Black, Helvetica, sans-serif"
        font-size="40" font-weight="800" font-style="italic" letter-spacing="0.5"
        fill="currentColor">ALENMOTORS</text>
</svg>
