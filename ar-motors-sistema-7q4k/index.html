<style>
:root{--red:#d7263d;--red-d:#b51d31;--red-s:#fdecee;--blue:#1f4fd1;--blue-d:#1a40ab;--blue-s:#e9efff;--ink:#15171c;--ink2:#373b45;--mut:#6b7280;--line:#e3e5ea;--bg:#f2f3f6;--card:#fff;--ok:#15803d;--ok-s:#e7f6ec;--warn:#b45309;--warn-s:#fdf3e2;--r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.demo-bar{background:#0b0c0f;color:#b9bdc7;font-size:12px;text-align:center;padding:5px 12px}
.demo-bar b{color:#fff;font-weight:600}
.rolebar{display:none;background:var(--warn-s);color:#7a3d06;font-size:13px;padding:8px 16px;text-align:center}
.rolebar button{color:var(--blue);font-weight:600;text-decoration:underline;margin-left:6px}
body.as-other .rolebar{display:block}
/* header */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-in{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand live" "search search";gap:10px 12px;padding:10px 16px 12px;max-width:1440px;margin:0 auto}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:#fff}
.logo{width:36px;height:36px;flex:none}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand-t span{display:block;font-size:12px;color:#aab0bd;white-space:nowrap}
.live{grid-area:live;align-self:center;display:inline-flex;align-items:center;gap:7px;background:#23262e;border:1px solid #333845;color:#e6e8ec;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
.live.off i{background:#9ca3af;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.search{grid-area:search;position:relative}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8d94a3;pointer-events:none}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid #343947;background:#22252d;color:#fff;padding:0 12px 0 40px;font-size:16px;letter-spacing:.3px;outline:none}
.search input::placeholder{color:#8d94a3;letter-spacing:0}
.search input:focus{border-color:var(--blue);background:#1c1f26}
.qres{position:absolute;left:0;right:0;top:50px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);overflow:hidden;display:none;z-index:50}
.qres.on{display:block}
.qres button{display:flex;width:100%;align-items:center;gap:12px;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.qres button:last-child{border-bottom:0}
.qres button:hover,.qres button.hl{background:#f5f7fb}
.qres .qx{font-size:13px;color:var(--mut)}
.qres .qe{padding:14px;color:var(--mut);font-size:14px}
/* shell */
.shell{max-width:1440px;margin:0 auto}
.side{display:none}
main{padding:16px 16px 100px;min-width:0}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:11px;color:var(--mut);font-weight:600;border-radius:10px;min-width:0}
.bottom button.on{color:var(--red)}
.bottom button.on svg{stroke:var(--red)}
[data-hide]{display:none!important}
@media(min-width:960px){
 .top-in{grid-template-columns:260px 1fr auto;grid-template-areas:"brand search live";padding:12px 24px}
 .search{max-width:560px}
 .shell{display:grid;grid-template-columns:232px 1fr}
 .side{display:block;position:sticky;top:68px;align-self:start;height:calc(100vh - 68px);padding:18px 12px;border-right:1px solid var(--line);background:#fff}
 .side button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink2);margin-bottom:2px;text-align:left}
 .side button:hover{background:#f4f5f8}
 .side button.on{background:var(--red-s);color:var(--red)}
 .side .sep{height:1px;background:var(--line);margin:12px 6px}
 .side .side-foot{font-size:12px;color:var(--mut);padding:10px 12px}
 main{padding:24px 28px 48px}
 .bottom{display:none}
 .only-m{display:none!important}
}
/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;letter-spacing:-.2px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:14px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:11px;font-weight:650;font-size:14.5px;background:#fff;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#cfd3db}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-d)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.blue:hover{background:var(--blue-d)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* cards */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.box h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:2px 8px;justify-content:space-between;flex-wrap:wrap}
.box h2 small{font-size:12.5px;color:var(--mut);font-weight:500}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh);min-width:0;text-align:left}
.kpi .k-l{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi .k-v{font-size:24px;font-weight:750;letter-spacing:-.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.red .k-v{color:var(--red)}
.kpi.blue .k-v{color:var(--blue)}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.home-grid{display:grid;gap:14px}
@media(min-width:1100px){.home-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
@media(max-width:1099px){.home-grid>.grid{display:contents}.hg1{order:1}.hg2{order:2}.hg3{order:3}.hg4{order:4}}
@media(max-width:959px){.hg3 .feed li:nth-child(n+7){display:none}}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:640px){.pipe{grid-template-columns:repeat(6,minmax(0,1fr))}}
.pipe button{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafbfc;min-width:0}
.pipe button:hover{border-color:#c9cfd9}
.pipe .pn{font-size:22px;font-weight:750;line-height:1.1}
.pipe .pl{font-size:12px;color:var(--mut);font-weight:600;margin-top:4px;line-height:1.2}
.pipe .pb{height:4px;border-radius:4px;margin-bottom:8px}
/* feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed li:last-child{border-bottom:0}
.feed li.new{animation:flash 2.2s ease}
@keyframes flash{0%{background:#fff7d6}100%{background:transparent}}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.feed .ft{font-size:14px;min-width:0}
.feed .ft b{font-weight:650}
.feed .fm{font-size:12px;color:var(--mut);margin-top:2px}
.feed button.lnk{color:var(--blue);font-weight:600}
/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t1{display:block;font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.alert-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.alert-i.red{background:var(--red-s);color:var(--red)}
.alert-i.amber{background:var(--warn-s);color:var(--warn)}
.alert-i.ok{background:var(--ok-s);color:var(--ok)}
.empty{padding:18px 4px;color:var(--mut);font-size:14px;display:flex;gap:10px;align-items:center}
/* plate */
.plate{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:1.5px solid #1b1d22;border-radius:5px;font-family:"Arial Narrow",Arial,sans-serif;font-weight:800;font-size:14px;letter-spacing:.8px;padding:0 6px 1px;line-height:1.15;color:#111;white-space:nowrap;flex:none}
.plate::before{content:"PERÚ";display:block;font-size:6.5px;letter-spacing:1.5px;color:#fff;background:#1f4fd1;margin:0 -6px 1px;padding:1px 0 0;width:calc(100% + 12px);text-align:center;border-radius:3px 3px 0 0}
.plate.lg{font-size:22px;padding:0 10px 2px}
.plate.lg::before{font-size:8px;margin:0 -10px 2px;width:calc(100% + 20px)}
/* badges */
.bd{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 8px;white-space:nowrap}
.bd.red{background:var(--red-s);color:var(--red)}
.bd.ok{background:var(--ok-s);color:var(--ok)}
.bd.amber{background:var(--warn-s);color:var(--warn)}
.bd.blue{background:var(--blue-s);color:var(--blue)}
.bd.gray{background:#eef0f3;color:#4b5563}
.bd svg.i{width:13px;height:13px}
.stg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 10px;color:#fff;white-space:nowrap}
/* kanban */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:650;white-space:nowrap}
.chip i{font-style:normal;background:#eef0f3;border-radius:99px;padding:1px 7px;font-size:12px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on i{background:#373b45;color:#fff}
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px;scroll-padding:0 16px}
.col{flex:none;width:84%;max-width:330px;scroll-snap-align:start;background:#e9ebf0;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-weight:700;font-size:14px}
.col-h .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.col-h .cnt{font-size:12px;background:#fff;border-radius:99px;padding:1px 8px;color:var(--ink2)}
.col-empty{font-size:13px;color:var(--mut);text-align:center;padding:14px 6px}
@media(min-width:960px){.board{margin:0;padding:2px 0 12px}.col{width:272px}.chips{margin:0;padding-left:0;padding-right:0}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.04);width:100%;position:relative;display:block}
.card:hover{border-color:#c6ccd6}
.card.stalled{border-color:#f0a3ad;box-shadow:inset 3px 0 0 var(--red)}
.card .c-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .c-id{font-size:12px;color:var(--mut);font-weight:650}
.card .c-veh{font-weight:700;font-size:14.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-cli{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-mot{font-size:12.5px;color:var(--mut);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c-bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card .c-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.card .c-foot .av{width:26px;height:26px;font-size:10.5px}
.card .c-who{font-size:12px;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-who b{color:var(--ink2);font-weight:650}
.card .c-amt{font-size:13px;font-weight:700;white-space:nowrap}
.adv{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:9px;height:36px;border-radius:9px;background:var(--blue-s);color:var(--blue);font-weight:700;font-size:13px}
.adv:hover{background:#dce6ff}
.adv.green{background:var(--ok-s);color:var(--ok)}
.adv.red{background:var(--red);color:#fff}
.adv svg.i{width:16px;height:16px}
/* sheet */
.sheet-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:none}
.sheet-wrap.on{display:block}
.scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,12,16,.5);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;top:5vh;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes down{from{transform:translateY(-16px);opacity:.3}to{transform:none;opacity:1}}
@media(max-width:959px){.toast{animation-name:down}}
@media(min-width:960px){.sheet{left:50%;top:4vh;bottom:4vh;width:min(860px,92vw);transform:translateX(-50%);border-radius:18px;animation:fade .2s}}
.sh-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.sh-h .sh-t{flex:1;min-width:0;font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h .sh-t small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.icb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:#f2f3f6;flex:none}
.icb:hover{background:#e7e9ee}
.sh-b{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}

.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .hv{flex:1;min-width:180px}

.hero .hv span{font-size:13.5px;color:var(--mut)}

.prog{display:flex;gap:4px;margin-top:12px}

.prog i.d{background:var(--blue)}

.prog-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:7px;gap:10px}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fuel{display:flex;gap:3px;margin-top:4px}

.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:4px}

.ph-t{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#eef1f6;aspect-ratio:4/3;min-height:96px;display:block;width:100%}

.frow{display:grid;gap:10px}

.items td.a{text-align:right;font-weight:650;white-space:nowrap;padding-left:10px}
.items td.x{width:34px;text-align:right}
.items .tag{font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase}
.items .rm{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;color:#9ca3af}
.items .rm:hover{background:var(--red-s);color:var(--red)}
.tot{margin-top:10px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--mut)}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-size:18px;color:var(--ink);font-weight:750;margin-top:4px}
.adder{display:grid;grid-template-columns:1fr 96px auto;gap:8px;margin-top:10px}
.adder .inp{height:42px;padding:0 10px}
.adder .btn{height:42px}
.adder .wide{grid-column:1/-1}
@media(max-width:639px){.adder{grid-template-columns:1fr auto}.adder select{grid-column:1/-1}}
.nw{white-space:nowrap}
.hero .tel{white-space:nowrap}
.packs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.packs button{font-size:12.5px;font-weight:650;border:1px dashed #b9c3da;color:var(--blue);border-radius:99px;padding:6px 11px;background:#f7f9ff}
.times .tr{display:grid;grid-template-columns:128px 1fr 76px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.times .tb{height:8px;border-radius:8px;background:#eef0f3;overflow:hidden}
.times .tb i{display:block;height:100%;border-radius:8px}
.times .tv{text-align:right;font-weight:650;white-space:nowrap}
.times .tr.cur .tv{color:var(--red)}
.log{list-style:none;margin:0;padding:0;position:relative}
.log li{position:relative;padding:0 0 12px 20px;font-size:13.5px}
.log li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.log li::after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.log li:last-child::after{display:none}
.log .lm{font-size:12px;color:var(--mut)}
.sign{border:1.5px dashed #b8bfcc;border-radius:12px;background:#fff;position:relative;touch-action:none;height:170px}
.sign canvas{width:100%;height:100%;display:block;border-radius:12px}
.sign .sp{position:absolute;left:14px;right:14px;bottom:36px;border-top:1px solid #d5d9e1;pointer-events:none}
.sign .sh{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--mut);pointer-events:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:650}
.seg button.on{border-color:var(--blue);background:var(--blue-s);color:var(--blue)}
.note{font-size:12.5px;color:var(--mut)}
.callout{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.callout.blue{background:var(--blue-s);color:#1c3b93}
.callout.ok{background:var(--ok-s);color:#14532d}
.callout.red{background:var(--red-s);color:#8f1526}
.callout.amber{background:var(--warn-s);color:#7a3d06}
.callout b{font-weight:700}
.sigimg{max-width:260px;width:100%;border-bottom:1px solid var(--line);display:block}
/* inventory */
.inv-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.inv-row:last-child{border-bottom:0}
.inv-row .n{font-weight:650;font-size:14.5px;min-width:0}
.inv-row .s{font-size:12px;color:var(--mut)}

.stockbar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.stockbar i.low{background:var(--red)}
.inv-r{text-align:right}
.inv-r .st{font-size:18px;font-weight:750}
.inv-r .st small{font-size:12px;color:var(--mut);font-weight:500}
.inv-act{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-in{position:relative;margin-bottom:12px}
.search-in .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search-in input{padding-left:40px}

.bars{display:flex;align-items:flex-end;gap:4px;padding-top:4px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bars .bw{height:150px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bars .b i{display:block;flex:none;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:#c7d4f6}
.bars .b.hi i{background:var(--blue)}
.bars .b.sun i{background:#e3e5ea}
.bars .b span{font-size:10.5px;color:var(--mut);margin-top:5px;white-space:nowrap}
.bars .b em{font-size:10px;font-style:normal;color:var(--ink2);font-weight:700;white-space:nowrap;margin-bottom:3px}
.hbars .hb{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.hbars .hb .tb{height:12px;border-radius:12px;background:#eef0f3;overflow:hidden}
.hbars .hb .tb i{display:block;height:100%;border-radius:12px}
.hbars .hb b{text-align:right;white-space:nowrap}
.rep-grid{display:grid;gap:14px}

.roles{display:grid;gap:12px}
@media(min-width:760px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}

.role ul{margin:0;padding:0;list-style:none;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.role li{display:flex;gap:7px;align-items:flex-start}
.role li svg.i{width:16px;height:16px;margin-top:1px}
.role li.y svg{color:var(--ok)}
.role li.n{color:var(--mut)}
.role li.n svg{color:#b8bdc7}
.role ul{margin-bottom:14px}
.role .btn{margin-top:auto}
.dot-on{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.more-list .row{padding:14px 0}
.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:26px 0 6px}
.foot b{color:var(--ink2)}

.toast .tg{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
.toast.err .tg{background:#f87171}
.toast.info .tg{background:#60a5fa}

#tour{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;display:none}
#tour.on{display:block}

#tour .bub p{margin:0;font-size:14px;color:var(--ink2)}
#tour .bub .ba{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

#track{display:none}
body.tracking #track{display:block}
body.tracking .app{display:none!important}
.trk{max-width:560px;margin:0 auto;padding:0 16px 40px}
.trk-h{display:flex;align-items:center;gap:10px;padding:16px 0}

.trk .big-stage{font-size:24px;font-weight:800;margin:6px 0 2px;letter-spacing:-.3px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 34px;min-height:40px}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#e3e5ea}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--blue)}
.tl .tk{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#e3e5ea;color:#fff}
.tl li.done .tk{background:var(--blue)}
.tl li.cur .tk{background:var(--red);box-shadow:0 0 0 5px var(--red-s)}
.tl .tk svg.i{width:14px;height:14px;stroke-width:3}
.tl .tt{font-weight:650;font-size:15px}
.tl li.pend .tt{color:#9ca3af;font-weight:550}
.tl .td{font-size:12.5px;color:var(--mut)}
.trk-demo{background:#15171c;color:#d7dae0;font-size:12.5px;padding:9px 14px;text-align:center}
.trk-demo button{color:#8fb0ff;font-weight:650;text-decoration:underline}

#print{display:none}
@media print{

 #print .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

 clisave:function(){var n=$('#kN').value.trim(),pl=$('#kP').value.trim().toUpperCase();if(!n){toast('Falta el nombre','err');return;}if(pl&&veh(pl)){toast('Esa placa ya está registrada','err');return;}var id='c'+Date.now();S.clients.push({id:id,nombre:n,tel:$('#kT').value.trim()||'—',doc:$('#kD').value.trim()?(($('#kD').value.trim().length>8?'RUC ':'DNI ')+$('#kD').value.trim()):'—'});if(normP(pl).length>=5){var np=normP(pl);var mo=$('#kMo').value.trim(),yr=(mo.match(/(19|20)\d\d/)||[''])[0];S.vehicles.push({placa:np.length===6?np.slice(0,3)+'-'+np.slice(3):pl,marca:$('#kM').value,modelo:mo.replace(yr,'').trim()||'—',anio:yr||'—',color:'—',km:0,cli:id});}touch();save();closeSheet();cliQ='';renderMain();toast('Cliente guardado');},
 newuser:function(){open1('user');},
 usersave:function(){var n=$('#uN').value.trim();if(!n){toast('Falta el nombre','err');return;}var rl=$('#uR').value;S.users.push({n:n,r:rl,on:false});touch();save();closeSheet();renderMain();toast('Usuario creado: '+n+' ('+rl+')');},
 tour:function(){if(S.role!=='admin'){S.role='admin';save();}stack=[];renderSheet();renderNav();startTour();},
 tournext:function(){tourStep++;showTour();},
 tourskip:function(){tourStep=-1;showTour();}
};
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');
 if(!el){if(!e.target.closest('#searchBox'))$('#qres').classList.remove('on');return;}
 if(el.disabled)return;
 var fn=A[el.dataset.act];if(fn){if(el.tagName==='A')e.preventDefault();e.stopPropagation();fn(el.dataset,e);}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card')){A.open(e.target.dataset);}
 if(e.key==='Escape'){if(tourStep>=0){tourStep=-1;showTour();}else if(stack.length)closeSheet();$('#qres').classList.remove('on');}});
document.addEventListener('change',function(e){
 var el=e.target;
 if(el.dataset&&el.dataset.change==='tech'){var o=getOT(el.dataset.id),t=techById(el.value);o.tech=el.value;logTo(o,me(),'reasignó la OT a '+t.n);pushFeed(whoLabel(me())+' asignó '+o.placa+' a '+t.c,o);touch();save();toast('Asignada a '+t.n+'. Le aparece en su celular.');renderMain();renderSheet();}
 if(el.dataset&&el.dataset.change==='svsel'){$('#svP').value=SERV[+el.value][1];}
 if(el.id==='photoIn'&&el.files&&el.files[0]&&pendingPhoto){var f=el.files[0],rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var cv=document.createElement('canvas'),w=320,h=Math.round(320*im.height/im.width);cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);var o=getOT(pendingPhoto[0]);o.fotos[pendingPhoto[1]]=cv.toDataURL('image/jpeg',.6);logTo(o,me(),'agregó una foto ('+pendingPhoto[1]+')');touch();save();renderSheet();toast('Foto guardada en la orden');};im.src=rd.result;};rd.readAsDataURL(f);}
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){qSel=0;renderQ();}
 if(e.target.id==='invQ'){invQ=e.target.value;var p=e.target.selectionStart;renderMain();var n=$('#invQ');n.focus();try{n.setSelectionRange(p,p);}catch(_){}}
 if(e.target.id==='cliQ'){cliQ=e.target.value;var p2=e.target.selectionStart;renderMain();var n2=$('#cliQ');n2.focus();try{n2.setSelectionRange(p2,p2);}catch(_){}}
});
$('#q').addEventListener('keydown',function(e){var btns=$$('#qres button');if(e.key==='ArrowDown'){qSel=Math.min(qSel+1,btns.length-1);renderQ();e.preventDefault();}else if(e.key==='ArrowUp'){qSel=Math.max(qSel-1,0);renderQ();e.preventDefault();}else if(e.key==='Enter'){if(btns[qSel]){btns[qSel].click();}e.preventDefault();}});
$('#q').addEventListener('focus',function(){if(this.value)renderQ();});
window.addEventListener('storage',function(e){if(e.key!==KEY||!e.newValue)return;try{var s=JSON.parse(e.newValue);if(s&&s.v===3){var role=S.role;S=s;S.role=role;if(isTracking())route();else{renderMain();var tp=stack.length?stack[stack.length-1][0]:'';if(tp==='ot'||tp==='placa')renderSheet();}}}catch(_){}});


/* ---------- router ---------- */
function isTracking(){return /^#seguimiento\//.test(location.hash);}
function route(){
 if(isTracking()){$$('.toast').forEach(function(x){x.remove();});document.body.classList.add('tracking');renderTrack(decodeURIComponent(location.hash.split('/')[1]||''));window.scrollTo(0,0);document.title='Seguimiento de tu vehículo · AR Motors';}
 else{document.body.classList.remove('tracking');$('#track').innerHTML='';document.title='AR Motors · Sistema del taller (demo)';renderNav();renderMain();}}
window.addEventListener('hashchange',route);

/* ---------- arranque ---------- */
S=load();if(S.role==='tec')view='ordenes';
setLive(S.live!==false);save();
route();lastFeedSeen=Date.now();
liveTimer=setInterval(tick,12000);
setInterval(function(){if(isTracking()){var id=decodeURIComponent(location.hash.split('/')[1]||'');renderTrack(id);return;}var f=$('#feed');if(f)f.innerHTML=feedHTML();},30000);
var seen=false;try{seen=localStorage.getItem(TOURKEY)==='1';}catch(e){seen=true;}
if(!seen&&!isTracking()&&S.role==='admin')setTimeout(function(){if(!stack.length&&tourStep<0)startTour();},1400);
window.__demo={S:function(){return S;},A:A,go:go,tick:tick,startTour:startTour};
})();
</script>
