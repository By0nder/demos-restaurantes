<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Ilustración de un bajo eléctrico (Neo Music, propuesta medida-familia). Colores del logo + carbón. -->
  <defs>
    <filter id="borde" x="-10%" y="-20%" width="120%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="grueso"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="grueso" operator="in" result="blanco"/>
      <feMerge><feMergeNode in="blanco"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#borde)" stroke="#2B292A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- clavijas (detrás del clavijero) -->
    <g fill="#fff">
      <rect x="546" y="146" width="13" height="22" rx="5"/>
      <rect x="566" y="141" width="13" height="22" rx="5"/>
      <rect x="586" y="136" width="13" height="22" rx="5"/>
      <rect x="606" y="131" width="13" height="22" rx="5"/>
    </g>
    <!-- clavijero -->
    <path fill="#FDDD3A" d="M524 187 L552 179 C572 174 592 166 610 160 C624 156 634 164 630 176 L624 204 C622 212 614 216 604 215 L524 214 Z"/>
    <!-- cuerpo -->
    <path fill="#E42829" d="M268 188 C268 158 284 124 318 102 C330 96 334 84 318 80 C296 74 262 82 236 86 C210 90 184 76 140 72 C92 68 46 90 34 136 C26 170 26 230 34 264 C46 310 92 332 140 328 C184 324 210 310 236 314 C262 318 280 322 296 312 C310 306 314 292 302 284 C288 274 270 250 268 212 Z"/>
    <!-- golpeador blanco -->
    <path fill="#fff" stroke-width="4" d="M266 190 C250 168 226 150 196 146 C168 142 146 152 140 168 C136 180 146 190 160 192 L160 214 C146 216 136 226 140 240 C148 262 190 270 222 262 C248 256 262 240 266 214 Z"/>
    <!-- mástil y diapasón -->
    <rect x="262" y="186" width="268" height="28" rx="4" fill="#2B292A"/>
    <!-- pastilla partida, puente y perillas -->
    <rect x="150" y="174" width="20" height="28" rx="5" fill="#2B292A"/>
    <rect x="174" y="198" width="20" height="28" rx="5" fill="#2B292A"/>
    <rect x="58" y="183" width="26" height="34" rx="6" fill="#2B292A"/>
    <circle cx="198" cy="288" r="12" fill="#2B292A"/>
    <circle cx="232" cy="280" r="12" fill="#2B292A"/>
  </g>
  <!-- trastes, marcadores, cejuela y cuerdas (sin borde) -->
  <g stroke="#fff" stroke-width="2.2" stroke-linecap="round">
    <path d="M506.8 189v22M486.9 189v22M468 189v22M450.2 189v22M433.4 189v22M417.6 189v22M402.6 189v22M388.5 189v22M375.2 189v22M362.6 189v22M350.7 189v22M339.5 189v22M328.9 189v22M318.9 189v22M309.5 189v22M300.6 189v22M292.2 189v22M284.3 189v22M276.8 189v22"/>
  </g>
  <g fill="#FDDD3A">
    <circle cx="477.5" cy="200" r="4"/><circle cx="441.8" cy="200" r="4"/><circle cx="410.1" cy="200" r="4"/><circle cx="381.9" cy="200" r="4"/>
    <circle cx="345.1" cy="193.5" r="3.6"/><circle cx="345.1" cy="206.5" r="3.6"/><circle cx="314.2" cy="200" r="4"/><circle cx="296.4" cy="200" r="4"/>
  </g>
  <rect x="524" y="186" width="6" height="28" fill="#fff" stroke="#2B292A" stroke-width="2"/>
  <g stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".95">
    <path d="M71 192.5H527L552 166"/>
    <path d="M71 197.5H527L572 161"/>
    <path d="M71 202.5H527L592 156"/>
    <path d="M71 207.5H527L612 151"/>
  </g>
  <g fill="#fff" stroke="#2B292A" stroke-width="3">
    <circle cx="552" cy="168" r="5"/><circle cx="572" cy="163" r="5"/><circle cx="592" cy="158" r="5"/><circle cx="612" cy="153" r="5"/>
  </g>
  <g fill="#fff"><circle cx="198" cy="288" r="3"/><circle cx="232" cy="280" r="3"/></g>
</svg>
